name: Probe Kenton official schedule (read-only)
on:
  push:
    branches: [feature/kenton-official-calendar]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Validate Kenton first-party schedule parser
        run: node tests/kenton-importer.js
      - name: Inspect live venue calendar without publishing
        run: node scripts/probe-kenton.js | tee /tmp/kenton-probe.txt
      - name: Summarize coverage probe
        run: |
          echo "## Kenton primary show-roster probe (read-only)" >> "$GITHUB_STEP_SUMMARY"
          echo '~~~json' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/kenton-probe.txt >> "$GITHUB_STEP_SUMMARY"
          echo '~~~' >> "$GITHUB_STEP_SUMMARY"
