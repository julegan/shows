name: Inspect TreeTix public access (diagnostic only)
on:
  push:
    branches: [discovery/treetix-access]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Inspect public pages without retries or publication
        shell: bash
        run: |
          node --check scripts/probe-treetix-access.js
          node scripts/probe-treetix-access.js | tee /tmp/treetix-access.txt
      - name: Record access diagnostics
        if: always()
        run: |
          echo '## TreeTix access diagnostics — not source acceptance' >> "$GITHUB_STEP_SUMMARY"
          echo 'API access is still required. HTTP failures do not imply no shows or cancellations.' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/treetix-access.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
