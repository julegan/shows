name: TreeTix Cloudflare blocked-request support diagnostic
on:
  push:
    branches:
      - diagnostics/treetix-cloudflare-request-20261102
  workflow_dispatch:
permissions:
  contents: read
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Record exact UTC time, public egress IP, same original User-Agent, HTTP and Cloudflare Ray
        run: |
          node --check scripts/diagnose-treetix-cloudflare.js
          node scripts/diagnose-treetix-cloudflare.js
