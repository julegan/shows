name: Probe Aladdin official calendar (read-only)
on:
  push:
    branches: [discovery/aladdin-connection]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect original venue listing without publishing
        run: node scripts/probe-aladdin.js
