name: Probe Turn Turn Turn official OpenDate roster (read-only)
on:
  push:
    branches: [feature/turnturnturn-opendate]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify original event detail import without publishing
        run: |
          node tests/turnturnturn-opendate.js
          node scripts/probe-turnturnturn-importer.js
