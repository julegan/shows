name: Propose existing event flyers (review-only)
on:
  workflow_dispatch:
    inputs:
      batch:
        description: "Zero-based group of up to 35 upcoming music event pages"
        required: false
        default: "0"
concurrency:
  group: shows-refresh
  cancel-in-progress: false
permissions:
  contents: write
  pull-requests: write
jobs:
  source-art:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Check for an existing artwork review PR
        id: pending
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          open="$(gh pr list --state open --json headRefName --jq '[.[] | select(.headRefName | startswith("automation/artwork-") or startswith("automation/refresh-") or startswith("automation/discovery-"))] | length')"
          if [ "$open" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Artwork review already pending. Merge or close that review PR before rerunning." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Find official event images
        if: steps.pending.outputs.skip != 'true'
        env:
          ARTWORK_BATCH: ${{ github.event.inputs.batch || github.run_number }}
          ARTWORK_BATCH_MODE: ${{ github.event_name == 'schedule' && 'rotate' || 'manual' }}
        run: node scripts/backfill-artwork.js
      - name: Show artwork results and gaps
        if: steps.pending.outputs.skip != 'true'
        run: cat discovery/artwork-backfill-review.md >> "$GITHUB_STEP_SUMMARY"
      - name: Keep artwork review report even when no PR is created
        if: steps.pending.outputs.skip != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artwork-review-${{ github.run_number }}
          path: discovery/artwork-backfill-review.md
          retention-days: 30
          if-no-files-found: error
      - name: Verify data and tests
        if: steps.pending.outputs.skip != 'true'
        run: |
          node tests/validate.js
          node tests/artwork.js
      - name: Create review-only PR
        if: steps.pending.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- events.js; then
            echo "No new event artwork from eligible sources." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch="automation/artwork-$(date -u +%Y%m%d)-$GITHUB_RUN_NUMBER"
          git config user.name "SHOWS artwork review bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -- events.js discovery/artwork-backfill-review.md
          git commit -m "Propose original source event artwork for review"
          git push --set-upstream origin "$branch"
          gh pr create --title "Review official event artwork" --head "$branch" --base main --body-file discovery/artwork-backfill-review.md
