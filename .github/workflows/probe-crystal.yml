name: Probe official Crystal Ballroom events (review-only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify dedicated Crystal event archive, room and source dates
        run: node scripts/probe-crystal.js
