name: Probe priority venues (read-only)
on:
  push:
    branches: [research/priority-venue-live-source-probes]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check first-party source availability
        run: node scripts/probe-priority-venues.js
