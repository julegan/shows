name: Discover venue events (review-only)
on:
  schedule:
    - cron: '17 16 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: shows-discovery
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check pending editorial PRs
        id: pending
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing="$(gh pr list --state open --json headRefName --jq '[.[] | select(.headRefName | startswith("automation/discovery-"))] | length')"
          if [ "$existing" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "One unreviewed discovery PR already exists. Refusing to create another." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Discover from enabled primary sources
        if: steps.pending.outputs.skip != 'true'
        run: node scripts/discover-events.js
      - name: Run source and event tests
        if: steps.pending.outputs.skip != 'true'
        run: |
          node --check scripts/discover-events.js
          node --check app.js
          node --check events.js
          node tests/discovery.js
          node tests/validate.js
      - name: Create candidate review PR
        if: steps.pending.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- events.js && [ ! -f discovery/latest-review.md ]; then
            echo "No new event candidates. Nothing proposed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch="automation/discovery-$(date -u +%Y%m%d)-$GITHUB_RUN_NUMBER"
          git config user.name "SHOWS discovery bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -- events.js discovery/latest-review.md
          git commit -m "Propose newly discovered primary-source venue events for review"
          git push --set-upstream origin "$branch"
          gh pr create --title "Review newly discovered Portland music listings" --head "$branch" --base main --body-file discovery/latest-review.md
          echo "Created an editorial review PR. The portfolio site is NOT updated." >> "$GITHUB_STEP_SUMMARY"
