name: 01 · Refresh SHOWS listings and flyers (review-only)
on:
  schedule:
    - cron: '17 16 * * *'
  # Re-run the combined review collector when its ingestion logic or source
  # configuration changes on main. Data-only review merges (events.js) do not
  # trigger another scan, so bot proposals cannot create a refresh loop.
  push:
    branches: [main]
    paths:
      - '.github/workflows/discover.yml'
      - 'scripts/discover-events.js'
      - 'scripts/source-change-review.js'
      - 'scripts/report-venue-gap.js'
      - 'tests/venue-gap-audit.js'
      - 'scripts/event-classification.js'
      - 'scripts/*-importer.js'
      - 'scripts/backfill-artwork.js'
      - 'scripts/*-leads.js'
      - 'discovery/sources.json'
      - 'discovery/venues.json'
      # Regression fixes must restart the collector after a blocked refresh.
      - 'tests/music-filters.js'
      - 'tests/validate.js'
  workflow_dispatch:
    inputs:
      artwork_batch:
        description: 'Zero-based group of up to 35 missing music images (manual runs)'
        required: false
        default: '0'
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: shows-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Find one existing rolling discovery review
        id: pending
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t prs < <(gh pr list --state open --limit 100 --json headRefName,number \
            --jq '.[] | select(.headRefName | test("^automation/refresh-[0-9]{8}-[0-9]+$")) | .number')
          if [ "${#prs[@]}" -gt 1 ]; then
            echo "::error::Multiple SHOWS refresh PRs are open. Reconcile before updating."
            exit 1
          fi
          number="${prs[0]:-}"
          if [ -n "$number" ]; then
            author="$(gh pr view "$number" --json author --jq '.author.login')"
            if [ "$author" != "app/github-actions" ] && [ "$author" != "github-actions[bot]" ]; then
              echo "::error::Refusing to overwrite a non-bot-authored PR."
              exit 1
            fi
            changes="$(gh pr view "$number" --json files --jq '.files[].path')"
            if [ "$(printf '%s\n' "$changes" | grep -v -E '^(events\.js|discovery/(latest-review|published-change-review|priority-venue-gap-audit|artwork-backfill-review|doomtown-leads-review|pdx-subvert-leads-review|wyrd-secondary-leads-review|republic-organizer-leads-review|oregon-electronic-leads-review)\.md)$' || true)" ]; then
              echo "::error::Pending review modifies unexpected files."
              exit 1
            fi
            echo "number=$number" >> "$GITHUB_OUTPUT"
            echo "Rolling SHOWS review PR #$number is open; any newly validated findings will refresh this same PR." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Show baseline priority coverage
        run: node scripts/report-priority-coverage.js >> "$GITHUB_STEP_SUMMARY"
      - name: Discover source-listed upcoming events
        env:
          COFFIN_VENUEPILOT_APP_ID: ${{ secrets.COFFIN_VENUEPILOT_APP_ID }}
        run: node scripts/discover-events.js
      - name: Collect original underground-show leads (review-only)
        run: node scripts/doomtown-leads.js
      - name: Collect PDX//SUBVERT original punk and metal show leads (research-only)
        run: node scripts/pdx-subvert-leads.js
      - name: Collect Wyrd secondary music leads (research-only)
        run: node scripts/wyrd-secondary-leads.js
      - name: Review Republic/Ming original organizer ticket leads
        run: node scripts/republic-organizer-leads.js
      - name: Review Portland underground electronic scene leads (secondary, no publishing)
        run: node scripts/19hz-scene-leads.js
      - name: Propose official art for existing and newly discovered music listings
        env:
          ARTWORK_BATCH: ${{ github.event.inputs.artwork_batch || github.run_number }}
          ARTWORK_BATCH_MODE: ${{ github.event_name == 'schedule' && 'rotate' || 'manual' }}
        run: node scripts/backfill-artwork.js
      - name: Record source outcomes and monthly horizon
        run: |
          sed -n '1,/## New candidates:/p' discovery/latest-review.md >> "$GITHUB_STEP_SUMMARY"
          echo "## Previously published events: source changes (review required)" >> "$GITHUB_STEP_SUMMARY"
          sed -n '1,22p' discovery/published-change-review.md >> "$GITHUB_STEP_SUMMARY"
          echo "Full discovery report is saved as the review artifact and committed to any proposal PR." >> "$GITHUB_STEP_SUMMARY"
          cat discovery/artwork-backfill-review.md >> "$GITHUB_STEP_SUMMARY"
          sed -n '1,6p' discovery/doomtown-leads-review.md >> "$GITHUB_STEP_SUMMARY"
          sed -n '1,8p' discovery/pdx-subvert-leads-review.md >> "$GITHUB_STEP_SUMMARY"
          sed -n '1,8p' discovery/wyrd-secondary-leads-review.md >> "$GITHUB_STEP_SUMMARY"
          sed -n '1,8p' discovery/republic-organizer-leads-review.md >> "$GITHUB_STEP_SUMMARY"
          sed -n '1,8p' discovery/oregon-electronic-leads-review.md >> "$GITHUB_STEP_SUMMARY"
          echo "Wyrd venue leads are secondary research only; original date and event identity need promoter/artist verification." >> "$GITHUB_STEP_SUMMARY"
          echo "Full Doomtown original-promoter lead report is in the uploaded artifact. WordPress post dates are not event dates." >> "$GITHUB_STEP_SUMMARY"
          node scripts/report-calendar-horizon.js >> "$GITHUB_STEP_SUMMARY"
          echo "## Priority venue source-to-approved coverage (56 days)" >> "$GITHUB_STEP_SUMMARY"
          sed -n '1,/## Source records needing individual verification/p' discovery/priority-venue-gap-audit.md >> "$GITHUB_STEP_SUMMARY"
      - name: Retain both review reports even on no-change days
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shows-refresh-review-${{ github.run_number }}
          path: |
            discovery/latest-review.md
            discovery/published-change-review.md
            discovery/priority-venue-gap-audit.md
            discovery/artwork-backfill-review.md
            discovery/doomtown-leads-review.md
            discovery/pdx-subvert-leads-review.md
            discovery/wyrd-secondary-leads-review.md
            discovery/republic-organizer-leads-review.md
            discovery/oregon-electronic-leads-review.md
          retention-days: 30
          if-no-files-found: error
      - name: Validate combined source, artwork and calendar data
        run: |
          node --check scripts/discover-events.js
          node --check scripts/source-change-review.js
          node --check scripts/turnturnturn-opendate.js
          node tests/turnturnturn-opendate.js
          node --check scripts/backfill-artwork.js
          node --check scripts/report-calendar-horizon.js
          node --check scripts/report-venue-gap.js
          node tests/venue-gap-audit.js
          node --check app.js
          node --check events.js
          node tests/source-health.js
          node tests/source-change-review.js
          node tests/published-change-queue.js
          node --check scripts/karaoke-format-review.js
          node tests/karaoke-format-review.js
          node tests/event-classification.js
          node tests/scene-source-backlog.js
          node tests/discovery.js
          node tests/artwork.js
          node tests/calendar-horizon.js
          node tests/source-priority.js
          node --check scripts/treetix-importer.js
          node tests/treetix-importer.js
          node --check scripts/mammoth-importer.js
          node tests/mammoth-importer.js
          node tests/nova-importer.js
          node tests/lolas-importer.js
          node --check scripts/showdown-importer.js
          node tests/showdown-importer.js
          node --check scripts/45east-redcube-importer.js
          node tests/45east-redcube-importer.js
          node tests/promoter-backlog.js
          node --check scripts/doomtown-leads.js
          node tests/doomtown-leads.js
          node --check scripts/pdx-subvert-leads.js
          node tests/pdx-subvert-leads.js
          node --check scripts/wyrd-secondary-leads.js
          node tests/wyrd-secondary-leads.js
          node --check scripts/republic-organizer-leads.js
          node tests/republic-organizer-leads.js
          node --check scripts/19hz-scene-leads.js
          node tests/19hz-scene-leads.js
          node tests/validate.js
      - name: Create or refresh a single rolling SHOWS review PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A uniquely identified official show may have been rescheduled or
          # canceled while new-event intake remains unchanged. That still merits
          # a review PR. Never edit/remove the published event automatically.
          if git diff --quiet -- events.js && ! grep -Eq '^\*\*Potential changes: [1-9][0-9]*\*\*' discovery/published-change-review.md; then
            echo "No new data or uniquely confirmed published-event changes. Reports remain in this run." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          set -euo pipefail
          number="${{ steps.pending.outputs.number }}"
          git config user.name "SHOWS refresh bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$number" ]; then
            branch="$(gh pr view "$number" --json headRefName --jq '.headRefName')"
            git fetch --no-tags origin "$branch"
            old_sha="$(git rev-parse FETCH_HEAD)"
            git show "$old_sha:events.js" > /tmp/shows-pending-events.js
            # Also compare published-change evidence: no-data-diff alerts must
            # refresh the existing bot PR rather than being silently skipped.
            git show "$old_sha:discovery/published-change-review.md" > /tmp/shows-pending-changes.md 2>/dev/null || rm -f /tmp/shows-pending-changes.md
            if cmp -s /tmp/shows-pending-events.js events.js && cmp -s /tmp/shows-pending-changes.md discovery/published-change-review.md; then
              echo "Existing review PR #$number already has the current event proposal and published-change evidence." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            git switch -C "$branch" main
          else
            branch="automation/refresh-$(date -u +%Y%m%d)-$GITHUB_RUN_NUMBER"
            git switch -c "$branch"
          fi
          git add -- events.js discovery/published-change-review.md discovery/latest-review.md discovery/priority-venue-gap-audit.md discovery/artwork-backfill-review.md discovery/doomtown-leads-review.md discovery/pdx-subvert-leads-review.md discovery/wyrd-secondary-leads-review.md discovery/republic-organizer-leads-review.md discovery/oregon-electronic-leads-review.md
          git commit -m "Propose latest source-confirmed Portland shows and flyers"
          if [ -n "$number" ]; then
            git push --force-with-lease="refs/heads/$branch:$old_sha" origin "$branch"
          else
            git push --set-upstream origin "$branch"
          fi
          {
            echo "# Combined SHOWS discovery + artwork review"
            echo
            echo "Source discoveries, changes to already-approved events, and event-specific artwork are staged for editorial review. Confirm event identity, date, venue, time type, status and image rights. **No published events are automatically modified or removed.**"
            echo
            echo "## Discovery snapshot"
            sed -n '1,/## New candidates:/p' discovery/latest-review.md
            echo
            echo "## Changes to already-approved events"
            sed -n '1,12p' discovery/published-change-review.md
            echo
            echo "## Coverage gap snapshot"
            sed -n '1,14p' discovery/priority-venue-gap-audit.md
            echo
            echo "## Artwork snapshot"
            sed -n '1,17p' discovery/artwork-backfill-review.md
            echo
            echo "## Full evidence"
            echo "- [Complete discovery candidates, holds, and source errors](https://github.com/$GITHUB_REPOSITORY/blob/$branch/discovery/latest-review.md)"
            echo "- [Changes to already-approved events — original evidence, no auto edits](https://github.com/$GITHUB_REPOSITORY/blob/$branch/discovery/published-change-review.md)"
            echo "- [56-day first-party venue coverage and unresolved gaps](https://github.com/$GITHUB_REPOSITORY/blob/$branch/discovery/priority-venue-gap-audit.md)"
            echo "- [Original flyer proposals, attribution, and missing-image reasons](https://github.com/$GITHUB_REPOSITORY/blob/$branch/discovery/artwork-backfill-review.md)"
            echo "- [Doomtown primary-promoter leads (not confirmed event dates)](https://github.com/$GITHUB_REPOSITORY/blob/$branch/discovery/doomtown-leads-review.md)"
            echo "- [PDX//SUBVERT original punk/metal leads (review only; timestamps unverified)](https://github.com/$GITHUB_REPOSITORY/blob/$branch/discovery/pdx-subvert-leads-review.md)"
            echo "- [Wyrd secondary artist leads (not approved shows)](https://github.com/$GITHUB_REPOSITORY/blob/$branch/discovery/wyrd-secondary-leads-review.md)"
            echo "- [Republic organizer original-ticket leads (not approved shows)](https://github.com/$GITHUB_REPOSITORY/blob/$branch/discovery/republic-organizer-leads-review.md)"
            echo "- [19hz Portland electronic scene leads (automated, unreviewed secondary listings)](https://github.com/$GITHUB_REPOSITORY/blob/$branch/discovery/oregon-electronic-leads-review.md)"
            echo "- [Action run and month-by-month summary](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
          } > /tmp/shows-refresh-review.md
          # Keep the GitHub PR description small even when hundreds of events are found.
          if [ "$(wc -c < /tmp/shows-refresh-review.md)" -gt 12000 ]; then
            echo "Combined PR summary unexpectedly exceeded 12 KB; check report formatting." >&2
            exit 1
          fi
          if [ -n "$number" ]; then
            gh pr edit "$number" --body-file /tmp/shows-refresh-review.md
            echo "Refreshed rolling canonical SHOWS PR #$number with current validated source proposals." >> "$GITHUB_STEP_SUMMARY"
          else
            gh pr create --title "Review refreshed Portland shows and original flyers" --head "$branch" --base main --body-file /tmp/shows-refresh-review.md
            echo "Created one rolling canonical SHOWS review PR." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "After canonical approval, Portfolio polls approved main and opens or refreshes its publishing PR." >> "$GITHUB_STEP_SUMMARY"
