name: Inspect underground Portland show listings (one-time)
on:
  push:
    branches: [discovery/pdx-subvert-punk-source-20261102]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: One bounded GET per public show-guide origin
        run: |
          node --check scripts/probe-pdx-subvert-access.js
          node scripts/probe-pdx-subvert-access.js
