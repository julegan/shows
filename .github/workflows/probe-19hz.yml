name: Inspect 19hz Oregon electronic scene listing
on:
  push:
    branches: [discovery/19hz-underground-leads-20261102]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Inspect secondary scene-list rows
        run: |
          node --check scripts/probe-19hz-html.js
          node scripts/probe-19hz-html.js
