name: Probe official Coffin Club event API (review-only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Verify public VenuePilot API data (no edits)
        env:
          COFFIN_VENUEPILOT_APP_ID: ${{ secrets.COFFIN_VENUEPILOT_APP_ID }}
        run: node scripts/probe-coffin-venuepilot.js
