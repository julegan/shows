name: Apply reviewed music labels to pending SHOWS PR 94 (one-time)
on:
  push:
    branches: [automation/refresh-20261102-1]
    paths: [.github/workflows/review-classification-once.yml]
permissions:
  contents: write
jobs:
  reviewed-classification:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out pending editorial review branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: automation/refresh-20261102-1
          persist-credentials: true
      - name: Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Apply exact event-level evidence and check idempotence
        run: |
          node scripts/backfill-event-classifications.js --write
          node tests/event-classification.js
          node tests/validate.js
      - name: Update only proposed events on same unmerged review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events.js
          if git diff --cached --quiet; then
            echo "No event changes were proposed. Investigate exact reviewed event IDs." >&2
            exit 1
          fi
          git commit -m "Apply eight event-specific High Water Mark music review corrections"
          git push origin HEAD:automation/refresh-20261102-1
