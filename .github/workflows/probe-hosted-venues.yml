name: Probe official Roseland and Hawthorne calendars (review-only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Roseland and Hawthorne official primary sources
        run: node scripts/probe-hosted-venues.js
