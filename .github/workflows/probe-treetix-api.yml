name: Inspect TreeTix public events API (review only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Check probe code and fixtures
        run: |
          node --check scripts/probe-treetix-api.js
          node tests/treetix-api-probe.js
      - name: Inspect public TreeTix events JSON (no imports or image downloads)
        run: node scripts/probe-treetix-api.js
