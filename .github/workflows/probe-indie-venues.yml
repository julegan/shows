name: Probe official Mississippi, Polaris and Holocene source health (review-only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Verify original Mississippi and Polaris stage listings
        run: node scripts/probe-mississippi.js
      - name: Verify Holocene venue event dates
        run: node scripts/probe-holocene.js
