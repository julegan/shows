name: Check calendar prototype
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check feedback.js
          node --check events.js
          node --check scripts/discover-events.js
          node --check scripts/kenton-importer.js
          node --check scripts/turnturnturn-opendate.js
          node --check scripts/backfill-artwork.js
          node --check scripts/report-calendar-horizon.js
      - name: Verify optional in-app feedback controls
        run: node tests/feedback-ui.js

      - name: Verify date-first music and culture browsing
        run: node tests/music-filters.js

      - name: Validate sample events
        run: |
          node tests/validate.js
          node tests/workflow-review-queue.js
          node --check scripts/scene-source-scout.js
          node tests/scene-source-scout.js
          node tests/source-change-review.js
          node tests/published-change-queue.js
          node tests/discovery.js
          node tests/kenton-importer.js
          node tests/turnturnturn-opendate.js
          node tests/offbeat-importer.js
          node tests/aladdin-importer.js
          node tests/mission-importer.js
          node --check scripts/lolas-importer.js
          node tests/lolas-importer.js
          node --check scripts/showdown-importer.js
          node tests/showdown-importer.js
          node --check scripts/45east-redcube-importer.js
          node tests/45east-redcube-importer.js
          node tests/promoter-backlog.js
          node tests/calendar-horizon.js

      - name: Validate retained TreeTix request diagnostic helper
        run: |
          node --check scripts/diagnose-treetix-cloudflare.js
          node tests/treetix-cloudflare-diagnostic.js

      - name: Validate The 1905 ticket performance importer
        run: |
          node --check scripts/the-1905-importer.js
          node tests/the-1905-importer.js
          node -e 'const m=require("./scripts/the-1905-importer"); const src=require("./discovery/sources.json").sources.find(s=>s.id==="the-1905"); m.fetchEvents(src).then(rows=>{if(!rows.some(r=>r.startDate&&r.sourcePerformanceId))process.exitCode=1; else console.log("LIVE 1905 "+JSON.stringify({checked:rows.length,verified:rows.filter(r=>r.startDate).length,distinctSets:new Set(rows.map(r=>r.sourcePerformanceId)).size}));}).catch(e=>{console.error(e);process.exitCode=1})'

      - name: Validate Alberta Street Pub source original calendar
        run: |
          node --check scripts/alberta-street-pub-importer.js
          node tests/alberta-street-pub-importer.js
          node -e 'const m=require("./scripts/alberta-street-pub-importer");const s=require("./discovery/sources.json").sources.find(s=>s.id==="alberta-street-pub");m.fetchEvents(s).then(rows=>{if(!rows.some(r=>r.startDate)||!rows.some(r=>r.fullUrl))process.exitCode=1;else console.log("LIVE ALBERTA "+JSON.stringify({checked:rows.length,verified:rows.filter(r=>r.startDate).length,held:rows.filter(r=>r.hold).length}));}).catch(e=>{console.error(e);process.exitCode=1})'

      - name: Validate original Jack London Revue event source
        run: |
          node --check scripts/jack-london-importer.js
          node tests/jack-london-importer.js
          node -e 'const m=require("./scripts/jack-london-importer"); const s=require("./discovery/sources.json").sources.find(s=>s.id==="jack-london-revue"); m.fetchEvents(s,fetch).then(r=>{const verified=r.filter(x=>x.startDate);if(!verified.length)process.exitCode=1;else console.log("LIVE JLR "+JSON.stringify({checked:r.length,verified:verified.length,held:r.length-verified.length}));}).catch(e=>{console.error(e);process.exitCode=1})'

      - name: Validate provider-approved TreeTix feed (offline fixtures)
        run: |
          node --check scripts/treetix-importer.js
          node tests/treetix-importer.js
          node --check scripts/mammoth-importer.js
          node tests/mammoth-importer.js
          node --check scripts/probe-mammoth.js

      - name: Validate original venue research priorities
        run: node tests/source-priority.js

      - name: Validate proposed promoter and label sources stay research-only
        run: node tests/scene-source-backlog.js

      - name: Validate priority venue importers
        run: |
          node --check scripts/priority-importers.js
          node tests/priority-importers.js
          node --check scripts/event-classification.js
          node tests/event-classification.js
          node --check scripts/karaoke-format-review.js
          node tests/karaoke-format-review.js
          node --check scripts/hosted-venue-importers.js
          node tests/hosted-venue-importers.js
          node --check scripts/dantes-importer.js
          node tests/dantes-importer.js
          node --check scripts/wonder-importer.js
          node tests/wonder-importer.js
          node --check scripts/probe-wonder.js
          node --check scripts/coffin-venuepilot.js
          node tests/coffin-venuepilot.js
          node --check scripts/nova-importer.js
          node tests/nova-importer.js
          node --check scripts/probe-nova-lolas.js
          node tests/nova-lolas-source-probe.js
          node --check scripts/probe-highlimit-public.js
          node tests/highlimit-public.js
          node --check scripts/revolution-importer.js
          node tests/revolution-importer.js
          node --check scripts/crystal-importer.js
          node tests/crystal-importer.js
          node --check scripts/probe-crystal.js
          node --check scripts/probe-revolution.js
          node --check scripts/probe-dantes.js
          node tests/black-water.js
          node tests/artwork.js
          node --check scripts/audit-venue-coverage.js
          node tests/venues.js
          node --check scripts/starday-importer.js
          node tests/starday-importer.js
          node --check scripts/probe-starday.js
          node --check scripts/mississippi-polaris-importer.js
          node tests/mississippi-polaris-importer.js
          node --check scripts/holocene-importer.js
          node tests/holocene-importer.js
          node --check scripts/doomtown-leads.js
          node tests/doomtown-leads.js
          node --check scripts/pdx-subvert-leads.js
          node tests/pdx-subvert-leads.js
          node --check scripts/wyrd-secondary-leads.js
          node tests/wyrd-secondary-leads.js
          node --check scripts/republic-organizer-leads.js
          node tests/republic-organizer-leads.js
          node --check scripts/19hz-scene-leads.js
          node tests/19hz-scene-leads.js
          node tests/wyrd-republic-research.js
          node --check scripts/probe-holocene.js
          node --check scripts/probe-mississippi.js
          node --check scripts/probe-crystal-revolution.js











