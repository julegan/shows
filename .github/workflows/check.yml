name: Check calendar prototype
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check events.js
          node --check scripts/discover-events.js
      - name: Validate sample events
        run: |
          node tests/validate.js
          node tests/discovery.js

      - name: Probe high-priority venue feeds (read-only)
        run: node scripts/probe-venue-sources.js

      - name: Validate original venue research priorities
        run: node tests/source-priority.js

      - name: Validate priority venue importers
        run: |
          node --check scripts/priority-importers.js
          node tests/priority-importers.js
          node tests/artwork.js
          node --check scripts/audit-venue-coverage.js
          node tests/venues.js
