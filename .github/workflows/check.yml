name: Check calendar prototype
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check events.js
          node --check scripts/discover-events.js
      - name: Validate sample events
        run: |
          node tests/validate.js
          node tests/discovery.js

      - name: Probe No Fun public event feed (pilot integration check)
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/auto-discovery-pilot-2026-10'
        continue-on-error: true
        run: |
          node scripts/discover-events.js
          node tests/validate.js

      - name: Validate original venue research priorities
        run: node tests/source-priority.js

      - name: Validate priority venue importers
        run: |
          node --check scripts/priority-importers.js
          node tests/priority-importers.js

      - name: Live import integration check (candidate-only)
        if: github.head_ref == 'feat/priority-importers-2026-10'
        continue-on-error: true
        timeout-minutes: 6
        run: |
          node scripts/discover-events.js
          node tests/validate.js
