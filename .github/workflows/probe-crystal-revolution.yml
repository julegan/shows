name: Probe Crystal Ballroom and Revolution Hall sources (review-only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Check official Crystal and Revolution event source structure
        run: node scripts/probe-crystal-revolution.js
