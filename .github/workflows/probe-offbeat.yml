name: Probe Off Beat official calendar (read-only)
on:
  push:
    branches: [discovery/offbeat-connection]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Inspect venue-linked public calendar without publishing
        run: |
          node tests/offbeat-importer.js
          node scripts/probe-offbeat.js
