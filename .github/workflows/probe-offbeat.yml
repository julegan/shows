name: Probe Off Beat official calendar (read-only)
on:
  push:
    branches: [discovery/offbeat-connection]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Inspect venue-linked public calendar without publishing
        run: |
          node tests/offbeat-importer.js
          node scripts/probe-offbeat.js
