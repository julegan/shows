name: Inspect Lola's Room official event source (read-only)
on:
  push:
    branches:
      - discovery/lolas-room-importer-20261101
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Original public Lola room/roster inspection
        run: |
          node --check scripts/probe-lolas-source.js
          node scripts/probe-lolas-source.js
