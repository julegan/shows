name: Probe Mission Theater official calendar (read-only)
on:
  push:
    branches: [discovery/mission-connection]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect original Mission calendar without publishing
        run: node scripts/probe-mission.js
